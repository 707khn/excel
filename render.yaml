databases:
  - name: excel-db
    databaseName: exceldb
    user: exceluser
    plan: free

services:
  - type: web
    name: excel-server
    runtime: python
    plan: free
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: excel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FILE_STORAGE_PATH
        value: /data/excel_files
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
