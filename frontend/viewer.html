<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Manager — Просмотр</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/xlsx.full.min.js"></script>
  <style>
    #sheetContainer { overflow: auto; background: #fff; }
    #sheetContainer table { border-collapse: collapse; font-size: .85rem; min-width: 100%; }
    #sheetContainer td, #sheetContainer th {
      border: 1px solid #d1d5db; padding: .3rem .5rem;
      white-space: nowrap; min-width: 80px;
    }
    #sheetContainer th { background: #f3f4f6; font-weight: 600; text-align: center; }
  </style>
</head>
<body>
<nav>
  <span class="brand">Excel Manager</span>
  <a href="/dashboard">← Назад</a>
  <button class="nav-btn" id="downloadBtn" style="display:none">⬇ Скачать</button>
</nav>

<div class="editor-toolbar">
  <span class="file-name" id="fileName">Загрузка...</span>
  <span class="badge badge-read">👁 Только чтение</span>
</div>

<div class="sheet-tabs" id="sheetTabs"></div>
<div id="sheetContainer" style="height: calc(100vh - 130px)"></div>
<div id="errorMsg" class="alert alert-error container" style="display:none"></div>

<script type="module">
  import { apiFetch, requireAuth, getCurrentUser } from "/static/js/api.js";
  if (!requireAuth()) throw new Error("not auth");

  const currentUser = getCurrentUser();

  const params = new URLSearchParams(location.search);
  const fileId = params.get("file_id");
  if (!fileId) { location.href = "/dashboard"; throw new Error(); }

  let workbook = null;
  let currentSheet = null;

  async function load() {
    const res = await apiFetch(`/files/${fileId}/content`);
    if (!res.ok) { showError("Ошибка загрузки файла"); return; }
    const data = await res.json();
    document.getElementById("fileName").textContent = data.filename;
    document.title = `${data.filename} — Просмотр`;
    const bytes = Uint8Array.from(atob(data.content), c => c.charCodeAt(0));
    workbook = XLSX.read(bytes, { type: "array", cellStyles: true, cellDates: true });
    renderSheetTabs();
    renderSheet(workbook.SheetNames[0]);

    if (currentUser && currentUser.is_admin) {
      const dlBtn = document.getElementById("downloadBtn");
      dlBtn.style.display = "";
      dlBtn.addEventListener("click", async () => {
        const dlRes = await apiFetch(`/files/${fileId}/download`);
        if (!dlRes.ok) { showError("Ошибка скачивания"); return; }
        const blob = await dlRes.blob();
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement("a"), { href: url, download: data.filename });
        a.click();
        URL.revokeObjectURL(url);
      });
    }
  }

  function renderSheetTabs() {
    const tabs = document.getElementById("sheetTabs");
    tabs.innerHTML = workbook.SheetNames.map(name => `
      <button class="sheet-tab" data-name="${escAttr(name)}">${escHtml(name)}</button>
    `).join("");
    tabs.querySelectorAll(".sheet-tab").forEach(btn => {
      btn.addEventListener("click", () => renderSheet(btn.dataset.name));
    });
  }

  function renderSheet(name) {
    currentSheet = name;
    document.querySelectorAll(".sheet-tab").forEach(b => b.classList.toggle("active", b.dataset.name === name));
    const ws = workbook.Sheets[name];
    const html = XLSX.utils.sheet_to_html(ws, { editable: false, id: "sheetTable" });
    document.getElementById("sheetContainer").innerHTML = html;
    applyFills(ws);
    applyNumberAndDateFormats(ws);
  }

  /* SheetJS Community Edition only exposes fill color (flat on cell.s), not fonts/borders. */
  function applyFills(ws) {
    Object.keys(ws).forEach(addr => {
      if (addr[0] === "!") return;
      const s = ws[addr]?.s;
      if (s?.patternType !== "solid" || !s.fgColor?.rgb) return;
      const rgb = s.fgColor.rgb.slice(-6);
      if (/^(F{6}|0{6})$/i.test(rgb)) return;
      const el = document.getElementById(`sheetTable-${addr}`);
      if (el) el.style.backgroundColor = "#" + rgb;
    });
  }

  /* Re-render numbers/dates with Russian-locale grouping and month names
     (sheet_to_html's default .w text uses English months / comma grouping). */
  const RU_MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  function stripFmtLiterals(fmt) {
    return String(fmt || "").replace(/\[[^\]]*\]/g, "").replace(/"[^"]*"/g, "");
  }
  function formatDateCell(date, fmt) {
    const f = stripFmtLiterals(fmt);
    const hasDay = /d/i.test(f), hasMonth = /m/i.test(f), hasYear = /y/i.test(f);
    const dd = String(date.getUTCDate()).padStart(2, "0");
    const mm = date.getUTCMonth();
    const yyyy = date.getUTCFullYear();
    if (hasMonth && hasYear && !hasDay) return `${RU_MONTHS_SHORT[mm]}.${String(yyyy).slice(-2)}`;
    if (hasMonth && !hasYear && !hasDay) return RU_MONTHS_SHORT[mm];
    return `${dd}.${String(mm + 1).padStart(2, "0")}.${yyyy}`;
  }
  function numFmtInfo(fmt) {
    const f = stripFmtLiterals(fmt);
    const percent = f.includes("%");
    const grouped = f.includes(",");
    const decMatch = /\.(0+)/.exec(f);
    const decimals = decMatch ? decMatch[1].length : 0;
    if (!percent && !grouped && decimals === 0) return null;
    return { percent, grouped, decimals };
  }
  function applyNumberAndDateFormats(ws) {
    Object.keys(ws).forEach(addr => {
      if (addr[0] === "!") return;
      const cell = ws[addr];
      const el = document.getElementById(`sheetTable-${addr}`);
      if (!el) return;
      if (cell.t === "d" && cell.v instanceof Date) {
        el.textContent = formatDateCell(cell.v, cell.z);
      } else if (cell.t === "n" && cell.z && cell.z !== "General" && cell.z !== "@") {
        const info = numFmtInfo(cell.z);
        if (!info) return;
        const opts = { minimumFractionDigits: info.decimals, maximumFractionDigits: info.decimals, useGrouping: info.grouped };
        el.textContent = info.percent
          ? (cell.v * 100).toLocaleString("ru-RU", opts) + "%"
          : cell.v.toLocaleString("ru-RU", opts);
      }
    });
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
  }

  function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function escAttr(s) { return s.replace(/"/g, "&quot;"); }

  load();
</script>
</body>
</html>
