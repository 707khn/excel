<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Manager — Редактор</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/vendor/jspreadsheet.css">
  <link rel="stylesheet" href="/static/vendor/jsuites.css">
  <script src="/static/vendor/xlsx.full.min.js"></script>
  <script src="/static/vendor/jsuites.js"></script>
  <script src="/static/vendor/jspreadsheet.js"></script>
  <style>
    #spreadsheet { overflow: auto; background: #fff; height: calc(100vh - 130px); }
    .jexcel_content { height: 100% !important; }
    .saving-badge { font-size: .8rem; color: #065f46; background: #d1fae5; padding: .2rem .6rem; border-radius: 999px; display: none; }
    .dirty-badge  { font-size: .8rem; color: #92400e; background: #fef3c7; padding: .2rem .6rem; border-radius: 999px; display: none; }
    #onlineUsers { font-size: .8rem; color: rgba(255,255,255,.85); display: flex; align-items: center; gap: .4rem; }
    .user-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    #wsStatus { font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; }
    .ws-ok  { background: #d1fae5; color: #065f46; }
    .ws-err { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
<nav>
  <span class="brand">Excel Manager</span>
  <a href="/dashboard">← Назад</a>
  <div id="onlineUsers"></div>
  <button class="nav-btn" id="downloadBtn" style="display:none">⬇ Скачать</button>
</nav>

<div class="editor-toolbar">
  <span class="file-name" id="fileName">Загрузка...</span>
  <span class="badge badge-write">✏️ Редактирование</span>
  <span class="dirty-badge" id="dirtyBadge">Несохранённые изменения</span>
  <span class="saving-badge" id="savingBadge">Сохранено ✓</span>
  <span id="wsStatus"></span>
  <select id="sheetSelect" style="padding:.3rem .5rem;border-radius:4px;border:1px solid #d1d5db;font-size:.85rem"></select>
  <button class="btn btn-primary btn-sm" id="saveBtn">Сохранить</button>
</div>

<div id="spreadsheet"></div>
<div id="errorMsg" class="alert alert-error container" style="display:none;margin-top:.5rem"></div>

<script type="module">
  import { apiFetch, requireAuth, getCurrentUser } from "/static/js/api.js";
  if (!requireAuth()) throw new Error("not auth");

  const user = getCurrentUser();
  if (user && user.is_admin) {
    document.getElementById("downloadBtn").style.display = "";
  }

  const params = new URLSearchParams(location.search);
  const fileId = params.get("file_id");
  if (!fileId) { location.href = "/dashboard"; throw new Error(); }

  let workbook = null;
  let currentSheetName = null;
  let isDirty = false;
  let jspInstance = null;
  let originalFilename = "";
  let applyingRemote = false;

  const dirtyBadge  = document.getElementById("dirtyBadge");
  const savingBadge = document.getElementById("savingBadge");
  const wsStatusEl  = document.getElementById("wsStatus");

  // ── WebSocket ──────────────────────────────────────────────────────────────
  let ws = null;
  let wsReconnectTimer = null;

  function connectWS() {
    const token = localStorage.getItem("access_token");
    if (!token) return;
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${proto}//${location.host}/ws/files/${fileId}?token=${encodeURIComponent(token)}`);

    ws.onopen = () => {
      wsStatusEl.textContent = "● онлайн";
      wsStatusEl.className = "ws-ok";
      if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }

      if (msg.type === "cell" && msg.sheet === currentSheetName && jspInstance) {
        applyingRemote = true;
        try {
          const inst = Array.isArray(jspInstance) ? jspInstance[0] : jspInstance;
          if (inst && inst.setValueFromCoords) {
            inst.setValueFromCoords(msg.col, msg.row, msg.value, true);
          }
        } finally {
          applyingRemote = false;
        }
      } else if (msg.type === "presence") {
        renderPresence(msg.users);
      }
    };

    ws.onclose = () => {
      wsStatusEl.textContent = "● офлайн";
      wsStatusEl.className = "ws-err";
      renderPresence([]);
      wsReconnectTimer = setTimeout(connectWS, 4000);
    };

    ws.onerror = () => ws.close();
  }

  function sendCell(row, col, value) {
    if (ws && ws.readyState === WebSocket.OPEN && !applyingRemote) {
      ws.send(JSON.stringify({ type: "cell", sheet: currentSheetName, row, col, value }));
    }
  }

  function renderPresence(users) {
    const el = document.getElementById("onlineUsers");
    if (!users.length) { el.innerHTML = ""; return; }
    el.innerHTML = '<span class="user-dot"></span>' +
      users.map(u => `<span>${escHtml(u)}</span>`).join(", ");
  }

  // ── Load ───────────────────────────────────────────────────────────────────
  async function load() {
    const res = await apiFetch(`/files/${fileId}/content`);
    if (!res.ok) {
      let msg = "Ошибка загрузки файла";
      try { const j = await res.json(); if (j.detail) msg = j.detail; } catch {}
      showError(msg); return;
    }
    const data = await res.json();

    if (data.access_level !== "write") {
      window.location.href = `/viewer?file_id=${fileId}`;
      return;
    }

    originalFilename = data.filename;
    document.getElementById("fileName").textContent = data.filename;
    document.title = `${data.filename} — Редактор`;

    const bytes = Uint8Array.from(atob(data.content), c => c.charCodeAt(0));
    workbook = XLSX.read(bytes, { type: "array", cellStyles: true });

    const sel = document.getElementById("sheetSelect");
    workbook.SheetNames.forEach(name => {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", () => switchSheet(sel.value));

    switchSheet(workbook.SheetNames[0]);

    document.getElementById("saveBtn").addEventListener("click", saveFile);
    document.getElementById("downloadBtn").addEventListener("click", downloadFile);

    connectWS();
  }

  // ── Sheet ──────────────────────────────────────────────────────────────────
  function switchSheet(name) {
    if (isDirty && currentSheetName) syncToWorkbook();
    currentSheetName = name;
    document.getElementById("sheetSelect").value = name;
    const ws = workbook.Sheets[name];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

    const container = document.getElementById("spreadsheet");
    container.innerHTML = "";
    if (jspInstance) {
      try {
        const inst = Array.isArray(jspInstance) ? jspInstance[0] : jspInstance;
        if (inst && inst.destroy) inst.destroy();
      } catch {}
    }

    const minCols = Math.max(aoa.reduce((m, r) => Math.max(m, r.length), 0), 10);
    const minRows = Math.max(aoa.length, 20);
    const data = padAoa(aoa, minRows, minCols);

    jspInstance = jspreadsheet(container, {
      data,
      minDimensions: [minCols, minRows],
      onchange: (el, cell, col, row, value) => {
        markDirty();
        sendCell(row, col, value);
      },
      columnDrag: false,
      rowDrag: false,
      allowInsertColumn: false,
      allowInsertRow: true,
      allowDeleteColumn: false,
      allowDeleteRow: true,
      tableOverflow: true,
      tableWidth: "100%",
      tableHeight: "calc(100vh - 140px)",
    });
  }

  function padAoa(aoa, rows, cols) {
    const out = [];
    for (let r = 0; r < rows; r++) {
      const row = aoa[r] || [];
      const padded = [];
      for (let c = 0; c < cols; c++) padded.push(row[c] !== undefined ? row[c] : "");
      out.push(padded);
    }
    return out;
  }

  function syncToWorkbook() {
    if (!jspInstance || !currentSheetName) return;
    const inst = Array.isArray(jspInstance) ? jspInstance[0] : jspInstance;
    const data = inst && inst.getData ? inst.getData() : null;
    if (!data) return;
    workbook.Sheets[currentSheetName] = XLSX.utils.aoa_to_sheet(data);
  }

  function markDirty() {
    isDirty = true;
    dirtyBadge.style.display = "inline-block";
    savingBadge.style.display = "none";
  }

  // ── Save ───────────────────────────────────────────────────────────────────
  async function saveFile() {
    syncToWorkbook();
    const saveBtn = document.getElementById("saveBtn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Сохранение...";
    try {
      const buf = XLSX.write(workbook, { type: "array", bookType: "xlsx" });
      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
      const res = await apiFetch(`/files/${fileId}/save`, {
        method: "POST",
        body: { content: b64 },
      });
      if (!res.ok) {
        const err = await res.json();
        showError(err.detail || "Ошибка сохранения");
        return;
      }
      isDirty = false;
      dirtyBadge.style.display = "none";
      savingBadge.style.display = "inline-block";
      setTimeout(() => { savingBadge.style.display = "none"; }, 3000);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Сохранить";
    }
  }

  // ── Download (admin only) ──────────────────────────────────────────────────
  async function downloadFile() {
    const dlRes = await apiFetch(`/files/${fileId}/download`);
    if (!dlRes.ok) { showError("Ошибка скачивания"); return; }
    const blob = await dlRes.blob();
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), { href: url, download: originalFilename });
    a.click();
    URL.revokeObjectURL(url);
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 5000);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  window.addEventListener("beforeunload", e => { if (isDirty) e.preventDefault(); });

  load();
</script>
</body>
</html>
