<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Manager — Администрирование</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<nav>
  <span class="brand">Excel Manager</span>
  <a href="/dashboard">← Файлы</a>
  <button class="nav-btn" id="logoutBtn">Выйти</button>
</nav>

<div class="container">
  <h1 class="page-title">Администрирование</h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="users">Пользователи</button>
    <button class="tab-btn" data-tab="files">Файлы</button>
    <button class="tab-btn" data-tab="logs">Журнал действий</button>
  </div>

  <!-- USERS TAB -->
  <div class="tab-panel active" id="tab-users">
    <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
      <button class="btn btn-primary" id="addUserBtn">+ Добавить пользователя</button>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table id="usersTable">
          <thead><tr><th>ID</th><th>Email</th><th>Имя</th><th>Роль</th><th>Статус</th><th>Действия</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- FILES TAB -->
  <div class="tab-panel" id="tab-files">
    <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
      <button class="btn btn-primary" id="uploadFileBtn">+ Загрузить файл</button>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table id="filesTable">
          <thead><tr><th>ID</th><th>Название</th><th>Описание</th><th>Размер</th><th>Загружен</th><th>Действия</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- LOGS TAB -->
  <div class="tab-panel" id="tab-logs">
    <div class="card" style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;margin-bottom:1rem">
      <div class="form-group" style="margin:0;flex:1;min-width:140px">
        <label>Действие</label>
        <select id="logActionFilter">
          <option value="">Все</option>
          <option>LOGIN</option><option>LOGIN_FAILED</option>
          <option>FILE_VIEW</option><option>FILE_DOWNLOAD</option>
          <option>FILE_EDIT_SAVE</option><option>FILE_UPLOAD</option>
          <option>FILE_DELETE</option><option>ADMIN_USER_CREATE</option>
          <option>ADMIN_USER_UPDATE</option><option>ADMIN_USER_DEACTIVATE</option>
          <option>ADMIN_PERMISSION_GRANT</option><option>ADMIN_PERMISSION_REVOKE</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="logRefreshBtn">Обновить</button>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table id="logsTable">
          <thead><tr><th>Время</th><th>Пользователь</th><th>Действие</th><th>Файл</th><th>IP</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="logsPagination" style="display:flex;gap:.5rem;justify-content:center;margin-top:1rem"></div>
    </div>
  </div>
</div>

<!-- Modal: Add/Edit User -->
<div class="modal-overlay hidden" id="userModal">
  <div class="modal">
    <h2 id="userModalTitle">Добавить пользователя</h2>
    <div id="userModalError" class="alert alert-error" style="display:none"></div>
    <form id="userForm">
      <input type="hidden" id="userId">
      <div class="form-group"><label>Email</label><input type="email" id="userEmail" required></div>
      <div class="form-group"><label>Полное имя</label><input type="text" id="userFullName" required></div>
      <div class="form-group"><label id="passLabel">Пароль</label><input type="password" id="userPassword" placeholder="Оставьте пустым, чтобы не менять"></div>
      <div class="form-group">
        <label>Роль</label>
        <select id="userIsAdmin"><option value="false">Сотрудник</option><option value="true">Администратор</option></select>
      </div>
      <div class="form-group" id="activeGroup" style="display:none">
        <label>Статус</label>
        <select id="userIsActive"><option value="true">Активен</option><option value="false">Заблокирован</option></select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="userModalClose">Отмена</button>
        <button type="submit" class="btn btn-primary" id="userModalSave">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Upload File -->
<div class="modal-overlay hidden" id="uploadModal">
  <div class="modal">
    <h2>Загрузить Excel файл</h2>
    <div id="uploadError" class="alert alert-error" style="display:none"></div>
    <form id="uploadForm">
      <div class="form-group"><label>Файл (.xlsx)</label><input type="file" id="fileInput" accept=".xlsx" required></div>
      <div class="form-group"><label>Описание</label><input type="text" id="fileDesc"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="uploadClose">Отмена</button>
        <button type="submit" class="btn btn-primary">Загрузить</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Permissions -->
<div class="modal-overlay hidden" id="permModal">
  <div class="modal" style="width:560px">
    <h2>Права доступа: <span id="permFileName"></span></h2>
    <div id="permError" class="alert alert-error" style="display:none"></div>
    <div id="permTable" style="max-height:300px;overflow-y:auto"></div>
    <hr style="margin:1rem 0">
    <h3 style="font-size:.95rem;margin-bottom:.75rem">Выдать доступ</h3>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <select id="permUserSelect" style="flex:1;padding:.4rem;border:1px solid #d1d5db;border-radius:4px;font-size:.9rem"></select>
      <select id="permLevel" style="padding:.4rem;border:1px solid #d1d5db;border-radius:4px;font-size:.9rem">
        <option value="read">Чтение</option><option value="write">Редактирование</option>
      </select>
      <button class="btn btn-primary btn-sm" id="grantPermBtn">Выдать</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="permClose">Закрыть</button>
    </div>
  </div>
</div>

<script type="module">
  import { apiFetch, requireAuth, getCurrentUser, clearTokens } from "/static/js/api.js";
  if (!requireAuth()) throw new Error("not auth");
  const me = getCurrentUser();
  if (!me || !me.is_admin) { location.href = "/dashboard"; throw new Error(); }

  document.getElementById("logoutBtn").addEventListener("click", () => { clearTokens(); location.href = "/"; });

  // ── Tabs ──────────────────────────────────────────────────────────────────
  let allUsers = [], allFiles = [];
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
      if (btn.dataset.tab === "logs") loadLogs(1);
    });
  });

  // ── Users ──────────────────────────────────────────────────────────────────
  async function loadUsers() {
    const res = await apiFetch("/admin/users");
    allUsers = await res.json();
    const tbody = document.querySelector("#usersTable tbody");
    tbody.innerHTML = allUsers.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${escHtml(u.email)}</td>
        <td>${escHtml(u.full_name)}</td>
        <td><span class="badge ${u.is_admin ? 'badge-admin' : 'badge-read'}">${u.is_admin ? 'Администратор' : 'Сотрудник'}</span></td>
        <td><span class="badge ${u.is_active ? 'badge-write' : 'badge-inactive'}">${u.is_active ? 'Активен' : 'Заблокирован'}</span></td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="editUser(${u.id})">Изменить</button>
          ${u.id !== me.id ? `<button class="btn btn-danger btn-sm" onclick="deactivateUser(${u.id}, ${u.is_active})">
            ${u.is_active ? 'Блокировать' : 'Разблокировать'}
          </button>` : ''}
        </td>
      </tr>`).join("");
  }

  document.getElementById("addUserBtn").addEventListener("click", () => openUserModal(null));
  document.getElementById("userModalClose").addEventListener("click", closeUserModal);
  document.getElementById("userForm").addEventListener("submit", submitUser);

  function openUserModal(user) {
    document.getElementById("userModalTitle").textContent = user ? "Изменить пользователя" : "Добавить пользователя";
    document.getElementById("userId").value = user ? user.id : "";
    document.getElementById("userEmail").value = user ? user.email : "";
    document.getElementById("userEmail").disabled = !!user;
    document.getElementById("userFullName").value = user ? user.full_name : "";
    document.getElementById("userPassword").value = "";
    document.getElementById("passLabel").textContent = user ? "Новый пароль (оставьте пустым, чтобы не менять)" : "Пароль";
    document.getElementById("userIsAdmin").value = user ? String(user.is_admin) : "false";
    document.getElementById("activeGroup").style.display = user ? "block" : "none";
    if (user) document.getElementById("userIsActive").value = String(user.is_active);
    document.getElementById("userModalError").style.display = "none";
    document.getElementById("userModal").classList.remove("hidden");
  }

  function closeUserModal() { document.getElementById("userModal").classList.add("hidden"); }

  async function submitUser(e) {
    e.preventDefault();
    const id = document.getElementById("userId").value;
    const isEdit = !!id;
    const body = isEdit ? {
      full_name: document.getElementById("userFullName").value,
      is_admin: document.getElementById("userIsAdmin").value === "true",
      is_active: document.getElementById("userIsActive").value === "true",
    } : {
      email: document.getElementById("userEmail").value,
      full_name: document.getElementById("userFullName").value,
      password: document.getElementById("userPassword").value,
      is_admin: document.getElementById("userIsAdmin").value === "true",
    };
    const pass = document.getElementById("userPassword").value;
    if (isEdit && pass) body.password = pass;
    if (!isEdit && !pass) { showModalError("userModalError", "Укажите пароль"); return; }
    const res = await apiFetch(isEdit ? `/admin/users/${id}` : "/admin/users", {
      method: isEdit ? "PUT" : "POST", body,
    });
    if (!res.ok) { const d = await res.json(); showModalError("userModalError", d.detail); return; }
    closeUserModal();
    loadUsers();
  }

  window.editUser = (id) => { const u = allUsers.find(x => x.id === id); if (u) openUserModal(u); };

  window.deactivateUser = async (id, isActive) => {
    if (!confirm(isActive ? "Заблокировать пользователя?" : "Разблокировать пользователя?")) return;
    await apiFetch(`/admin/users/${id}`, { method: "PUT", body: { is_active: !isActive } });
    loadUsers();
  };

  // ── Files ──────────────────────────────────────────────────────────────────
  async function loadFiles() {
    const res = await apiFetch("/admin/files");
    allFiles = await res.json();
    const tbody = document.querySelector("#filesTable tbody");
    tbody.innerHTML = allFiles.map(f => `
      <tr>
        <td>${f.id}</td>
        <td>${escHtml(f.filename)}</td>
        <td>${f.description ? escHtml(f.description) : '<span class="text-muted">—</span>'}</td>
        <td>${f.file_size ? fmtSize(f.file_size) : '—'}</td>
        <td>${new Date(f.created_at).toLocaleString("ru")}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="openPerms(${f.id}, '${escAttr(f.filename)}')">Права</button>
          <button class="btn btn-danger btn-sm" onclick="deleteFile(${f.id}, '${escAttr(f.filename)}')">Удалить</button>
        </td>
      </tr>`).join("");
  }

  document.getElementById("uploadFileBtn").addEventListener("click", () => {
    document.getElementById("uploadModal").classList.remove("hidden");
    document.getElementById("uploadError").style.display = "none";
    document.getElementById("uploadForm").reset();
  });
  document.getElementById("uploadClose").addEventListener("click", () => document.getElementById("uploadModal").classList.add("hidden"));
  document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData();
    fd.append("file", document.getElementById("fileInput").files[0]);
    const desc = document.getElementById("fileDesc").value;
    if (desc) fd.append("description", desc);
    const res = await apiFetch("/admin/files/upload", { method: "POST", body: fd });
    if (!res.ok) { const d = await res.json(); showModalError("uploadError", d.detail); return; }
    document.getElementById("uploadModal").classList.add("hidden");
    loadFiles();
  });

  window.deleteFile = async (id, name) => {
    if (!confirm(`Удалить файл "${name}"? Это действие необратимо.`)) return;
    await apiFetch(`/admin/files/${id}`, { method: "DELETE" });
    loadFiles();
  };

  // ── Permissions ────────────────────────────────────────────────────────────
  let currentPermFileId = null;

  window.openPerms = async (fileId, fileName) => {
    currentPermFileId = fileId;
    document.getElementById("permFileName").textContent = fileName;
    document.getElementById("permError").style.display = "none";
    document.getElementById("permModal").classList.remove("hidden");
    await loadPerms(fileId);
    populateUserSelect();
  };
  document.getElementById("permClose").addEventListener("click", () => document.getElementById("permModal").classList.add("hidden"));

  async function loadPerms(fileId) {
    const res = await apiFetch(`/admin/files/${fileId}/permissions`);
    const perms = await res.json();
    document.getElementById("permTable").innerHTML = perms.length ? `
      <table style="width:100%;border-collapse:collapse;font-size:.85rem">
        <thead><tr><th style="padding:.4rem;border-bottom:1px solid #e5e7eb">Пользователь</th><th style="padding:.4rem;border-bottom:1px solid #e5e7eb">Email</th><th style="padding:.4rem;border-bottom:1px solid #e5e7eb">Доступ</th><th style="padding:.4rem;border-bottom:1px solid #e5e7eb"></th></tr></thead>
        <tbody>${perms.map(p => `<tr>
          <td style="padding:.4rem">${escHtml(p.user_full_name)}</td>
          <td style="padding:.4rem">${escHtml(p.user_email)}</td>
          <td style="padding:.4rem"><span class="badge ${p.access_level==='write'?'badge-write':'badge-read'}">${p.access_level==='write'?'Редактирование':'Чтение'}</span></td>
          <td style="padding:.4rem"><button class="btn btn-danger btn-sm" onclick="revokePerm(${fileId},${p.user_id})">Отозвать</button></td>
        </tr>`).join("")}</tbody>
      </table>` : '<p class="text-muted" style="padding:.5rem">Нет выданных прав</p>';
  }

  function populateUserSelect() {
    const sel = document.getElementById("permUserSelect");
    sel.innerHTML = allUsers.filter(u => u.is_active && !u.is_admin).map(u =>
      `<option value="${u.id}">${escHtml(u.full_name)} (${escHtml(u.email)})</option>`
    ).join("");
  }

  document.getElementById("grantPermBtn").addEventListener("click", async () => {
    const uid = parseInt(document.getElementById("permUserSelect").value);
    const level = document.getElementById("permLevel").value;
    const res = await apiFetch(`/admin/files/${currentPermFileId}/permissions`, {
      method: "POST", body: { user_id: uid, access_level: level },
    });
    if (!res.ok) { const d = await res.json(); showModalError("permError", d.detail); return; }
    loadPerms(currentPermFileId);
  });

  window.revokePerm = async (fileId, userId) => {
    if (!confirm("Отозвать доступ?")) return;
    await apiFetch(`/admin/files/${fileId}/permissions/${userId}`, { method: "DELETE" });
    loadPerms(fileId);
  };

  // ── Logs ──────────────────────────────────────────────────────────────────
  let logsPage = 1;
  document.getElementById("logRefreshBtn").addEventListener("click", () => loadLogs(1));

  async function loadLogs(page) {
    logsPage = page;
    const action = document.getElementById("logActionFilter").value;
    const params = new URLSearchParams({ page, limit: 50 });
    if (action) params.set("action", action);
    const res = await apiFetch(`/admin/logs?${params}`);
    const data = await res.json();
    const tbody = document.querySelector("#logsTable tbody");
    tbody.innerHTML = data.items.map(l => `
      <tr>
        <td style="white-space:nowrap">${new Date(l.created_at).toLocaleString("ru")}</td>
        <td>${escHtml(l.user_email)}</td>
        <td><code style="font-size:.8rem;background:#f3f4f6;padding:.1rem .3rem;border-radius:3px">${l.action}</code></td>
        <td>${l.file_name ? escHtml(l.file_name) : '<span class="text-muted">—</span>'}</td>
        <td style="font-size:.8rem;color:#6b7280">${l.ip_address}</td>
      </tr>`).join("");
    renderPagination(data.total, data.page, data.limit);
  }

  function renderPagination(total, page, limit) {
    const pages = Math.ceil(total / limit);
    const el = document.getElementById("logsPagination");
    if (pages <= 1) { el.innerHTML = ""; return; }
    let html = "";
    for (let i = 1; i <= Math.min(pages, 10); i++) {
      html += `<button class="btn btn-sm ${i===page?'btn-primary':'btn-secondary'}" onclick="loadLogs(${i})">${i}</button>`;
    }
    el.innerHTML = html;
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  function escHtml(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function escAttr(s) { return String(s||"").replace(/'/g, "\\'"); }
  function fmtSize(b) { return b > 1048576 ? (b/1048576).toFixed(1)+" MB" : (b/1024).toFixed(0)+" KB"; }
  function showModalError(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = "block"; }

  window.loadLogs = loadLogs;

  // ── Init ──────────────────────────────────────────────────────────────────
  loadUsers();
  loadFiles();
</script>
</body>
</html>
