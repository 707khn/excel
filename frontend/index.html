<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Manager — Вход</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrapper">
  <div class="login-box">
    <h1>Excel Manager</h1>
    <p>Введите данные для входа</p>
    <div id="error" class="alert alert-error" style="display:none"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@company.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Войти</button>
    </form>
  </div>
</div>
<script type="module">
  import { clearTokens } from "/static/js/api.js";
  clearTokens();

  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("error");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Вход...';

    const body = new URLSearchParams({
      username: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });

    try {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.detail || "Неверные данные");
        return;
      }
      localStorage.setItem("access_token", data.access_token);
      localStorage.setItem("refresh_token", data.refresh_token);

      const meRes = await fetch("/auth/me", {
        headers: { Authorization: `Bearer ${data.access_token}` },
      });
      const user = await meRes.json();
      localStorage.setItem("current_user", JSON.stringify(user));
      window.location.href = "/dashboard";
    } catch {
      showError("Ошибка соединения с сервером");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Войти";
    }
  });

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }
</script>
</body>
</html>
